name: Viral Motion Graphics Reel Engine

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Video ka Topic likhein (e.g. AI Website Builder, Gym Fat Loss, Real Estate Leads)'
        required: true
        default: 'AI Customer Support App for Business'
        type: string
      voice_style:
        description: 'Voice Style (bunny = Cute High-Pitch Bunny/Puchu, male = Punchy Creator Male)'
        required: true
        default: 'bunny'
        type: choice
        options:
          - bunny
          - male
      theme:
        description: 'Color Theme (royal_indigo, emerald_tech, midnight_gold)'
        required: true
        default: 'royal_indigo'
        type: choice
        options:
          - royal_indigo
          - emerald_tech
          - midnight_gold

jobs:
  render-viral-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Fast Python Video Stack
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          pip install edge-tts requests pillow numpy

      - name: Generate AI Script, Bunny Voice, BGM & Layered SFX
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 audio_engine.py "${{ github.event.inputs.topic }}" "${{ github.event.inputs.voice_style }}"

      - name: Render 30FPS Stylish Motion Graphics & Compile MP4
        run: python3 render_video.py "${{ github.event.inputs.theme }}"

      - name: Upload Viral Reel MP4
        uses: actions/upload-artifact@v4
        with:
          name: viral-motion-reel
          path: final_reel.mp4
