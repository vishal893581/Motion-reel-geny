name: Viral Studio Pro ElevenLabs + Heavy Motion (v12)

on:
  workflow_dispatch:
    inputs:
      niche_or_topic:
        description: 'Topic likhein (Khali chhod dein toh AI khud trending viral topic chunega!)'
        required: false
        default: ''
        type: string
      voice_style:
        description: 'Voice Style (cute_viral = Expressive Viral Female, energetic_male = Deep Punchy Male)'
        required: true
        default: 'cute_viral'
        type: choice
        options:
          - cute_viral
          - energetic_male

jobs:
  produce-viral-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Fast Python Video, Graphics & Audio Stack
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          pip install edge-tts requests pillow

      - name: Generate AI Script, Designer Palette & ElevenLabs Human Voice
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python3 audio_engine.py "${{ github.event.inputs.niche_or_topic }}" "${{ github.event.inputs.voice_style }}"

      - name: Render 30FPS Ultra-Heavy Motion Graphics Studio Reel
        run: python3 render_video.py

      - name: Upload Viral Reel MP4
        uses: actions/upload-artifact@v4
        with:
          name: viral-pro-v12-${{ github.run_number }}
          path: final_reel.mp4
