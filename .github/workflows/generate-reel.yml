name: Viral Motion Graphics Reel Engine

on:
  workflow_dispatch:
    inputs:
      voice_provider:
        description: 'Voice Engine (edge = Free Punchy Male, elevenlabs = Ultra Studio Real)'
        required: true
        default: 'edge'
        type: choice
        options:
          - edge
          - elevenlabs
      theme:
        description: 'Color Theme (royal_indigo, emerald_tech, midnight_gold)'
        required: true
        default: 'royal_indigo'
        type: choice
        options:
          - royal_indigo
          - emerald_tech
          - midnight_gold

jobs:
  render-viral-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Fast Rendering Stack
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core xvfb
          pip install edge-tts requests
          npm init -y
          npm install playwright-core gsap

      - name: Generate Voiceover, BGM & Layered SFX
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 audio_engine.py "${{ github.event.inputs.voice_provider }}"

      - name: Render High-Speed Motion Frames & Compile MP4
        run: xvfb-run --server-args="-screen 0 1080x1920x24" node render_video.js "${{ github.event.inputs.theme }}"

      - name: Upload Viral Reel MP4
        uses: actions/upload-artifact@v4
        with:
          name: viral-motion-reel
          path: final_reel.mp4
