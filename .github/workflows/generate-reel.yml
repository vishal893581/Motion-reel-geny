name: Viral Studio Pro ElevenLabs + Heavy Motion (v13 Verified)

on:
  workflow_dispatch:
    inputs:
      niche_or_topic:
        description: 'Topic likhein (Khali chhod dein toh AI khud trending viral topic chunega!)'
        required: false
        default: ''
        type: string
      voice_style:
        description: 'Voice Style (cute_viral = Expressive Viral Female, energetic_male = Deep Punchy Male)'
        required: true
        default: 'cute_viral'
        type: choice
        options:
          - cute_viral
          - energetic_male

jobs:
  produce-viral-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Fast Python & FFmpeg Stack
        run: |
          pip install --quiet edge-tts requests pillow static-ffmpeg
          python3 -c "import static_ffmpeg; static_ffmpeg.add_paths()"
          sudo ln -sf "$(find ~/.local /usr -name ffmpeg -type f 2>/dev/null | head -n 1)" /usr/local/bin/ffmpeg
          sudo ln -sf "$(find ~/.local /usr -name ffprobe -type f 2>/dev/null | head -n 1)" /usr/local/bin/ffprobe
          ffmpeg -version
          ffprobe -version

      - name: Generate AI Script, Designer Palette & ElevenLabs Human Voice
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python3 audio_engine.py "${{ github.event.inputs.niche_or_topic }}" "${{ github.event.inputs.voice_style }}"

      - name: Render 30FPS Ultra-Heavy Motion Graphics Studio Reel
        run: python3 render_video.py

      - name: Upload Viral Reel MP4
        uses: actions/upload-artifact@v4
        with:
          name: viral-pro-v13-${{ github.run_number }}
          path: final_reel.mp4
