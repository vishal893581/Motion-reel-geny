name: Auto Viral 9x16 Money Reels Generator & Publisher (V25)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Custom Topic (leave blank for auto unique teaching video)'
        required: false
        default: ''
  schedule:
    - cron: '30 3,13 * * *'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
          pip install requests Pillow edge-tts
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Generate 9:16 Motion Graphics + Voice
        env:
          TOPIC: ${{ github.event.inputs.topic }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID || vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          python3 audio_engine.py "$TOPIC" viraj kinetic_9x16
          python3 render_video.py

      - name: Auto Publish to Instagram
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          CATBOX_USERHASH: ${{ secrets.CATBOX_USERHASH }}
        run: |
          python3 auto_publish.py

      - name: Save Topic History
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_topics.txt series_day.txt
          git diff --staged --quiet || git commit -m "chore: update used topics history"
          git push

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final_video_v25_9x16
          path: |
            final_reel.mp4
            cover.png
            caption.txt
